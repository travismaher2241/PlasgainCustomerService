<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plasgain Sales Workspace</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #080a09;
        --brand: #00a651;
        --paper: #141715;
        --line: #2a2f2c;
        --text: #f4f6f5;
        --dim: #9aa3a0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--ink);
        color: var(--text);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card { max-width: 460px; }
      .mark {
        width: 44px; height: 44px; border-radius: 8px;
        background: var(--ink); border: 1px solid var(--line);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 20px;
      }
      .mark svg { width: 28px; height: 28px; display: block; }
      h1 { font-size: 20px; margin: 0 0 10px; letter-spacing: -0.01em; }
      p { margin: 0 0 14px; color: var(--dim); }
      .detail {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--dim);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        margin: 0 0 20px;
        word-break: break-word;
      }
      button {
        font: inherit; font-weight: 600;
        color: #fff; background: var(--brand);
        border: 0; border-radius: 6px;
        padding: 10px 18px; cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .hint { font-size: 13px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M9 24V8h7.5a5.5 5.5 0 0 1 0 11H13v5H9Zm4-8.5h3.2a2.2 2.2 0 0 0 0-4.4H13v4.4Z" fill="#00a651" />
        </svg>
      </div>

      <h1>Can't reach the workspace</h1>
      <p>
        The app is installed and running — it just couldn't load
        <span id="target">the workspace</span>. That usually means no network,
        or the server is down.
      </p>
      <p class="detail" id="detail" hidden></p>

      <button id="retry" type="button">Try again</button>

      <p class="hint">
        If this keeps happening, check the workspace in your browser. Your data
        is on the server, so nothing entered earlier is lost.
      </p>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const url = params.get("url");
      const detail = params.get("detail");

      if (url) document.getElementById("target").textContent = url;
      if (detail) {
        const el = document.getElementById("detail");
        el.textContent = detail;
        el.hidden = false;
      }

      document.getElementById("retry").addEventListener("click", () => {
        window.plasgainDesktop?.retry();
      });
    </script>
  </body>
</html>
