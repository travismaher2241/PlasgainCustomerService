<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plasgain Sales Workspace</title>
    <meta name="description" content="Internal sales, product knowledge, and enquiry analysis copilot for Plasgain Lighting Australia." />
    <meta property="og:title" content="Plasgain Sales Workspace" />
    <meta property="og:description" content="Internal sales, product knowledge, and enquiry analysis copilot for Plasgain Lighting Australia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080A09" />

    <!-- Installable to a phone home screen or a desktop, with its own icon and
         window instead of a browser tab. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plasgain" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered only over HTTPS, which means the deployed app and never the
      // local dev server: a worker sitting in front of Vite intercepts the
      // module reloads it serves and makes a live edit look like a broken one.
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            // Installability is a nicety; the app works without it.
            console.warn("Service worker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
